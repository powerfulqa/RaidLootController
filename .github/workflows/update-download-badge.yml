name: Update download-count badge

on:
  # The Release workflow publishes with GITHUB_TOKEN, which does not fire
  # `release` events, so follow the workflow run instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badge-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout badge-data branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: badge-data

      - name: Compute badge data
        id: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # counts.json keeps the highest count ever seen per release tag, so
          # the lifetime total survives deleted releases.
          [ -f counts.json ] || echo '{}' > counts.json
          gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | {(.tag_name): ([.assets[].download_count] | add // 0)}' \
            | jq -s 'add // {}' > current.json
          jq -s '.[0] as $old | .[1] as $new
                 | ($old + $new) | with_entries(.value = ([($old[.key] // 0), ($new[.key] // 0)] | max))' \
            counts.json current.json > merged.json
          mv merged.json counts.json
          rm current.json
          TOTAL=$(jq '[.[]] | add // 0' counts.json)
          VERSION=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq '[.assets[].download_count] | add // 0')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Downloads: $TOTAL   This release: $LATEST   Latest version: $VERSION"

      - name: Update JSON if changed
        # Self-hosted shields endpoints on the badge-data branch. The Download
        # (version), Downloads (lifetime), and Downloads (this release) badges
        # all read these static JSON files, so none depend on shields.io's
        # shared GitHub token pool (which intermittently fails with "unable
        # to select next GitHub token from pool"). Updated on each release +
        # every 6h.
        env:
          TOTAL: ${{ steps.data.outputs.total }}
          VERSION: ${{ steps.data.outputs.version }}
          LATEST: ${{ steps.data.outputs.latest }}
        run: |
          echo "{\"schemaVersion\":1,\"label\":\"Downloads\",\"message\":\"$TOTAL\",\"color\":\"blue\"}" > downloads.json
          echo "{\"schemaVersion\":1,\"label\":\"Download\",\"message\":\"$VERSION\",\"color\":\"orange\"}" > version.json
          echo "{\"schemaVersion\":1,\"label\":\"Downloads (this release)\",\"message\":\"$LATEST\",\"color\":\"blue\"}" > latest.json
          git add counts.json downloads.json version.json latest.json
          if git diff --cached --quiet; then
            echo "No change (downloads=$TOTAL, latest=$LATEST, version=$VERSION); skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update badge data (downloads=$TOTAL, latest=$LATEST, version=$VERSION)"
          git push origin badge-data
